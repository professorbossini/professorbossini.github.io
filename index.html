<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5B2DB0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#140E26" media="(prefers-color-scheme: dark)" />
    <style>
      /* cor de fundo antes do React carregar (tema Faísca) */
      html[data-light] {
        background: #fbfafe;
        color-scheme: light;
      }
      html[data-dark] {
        background: #140e26;
        color-scheme: dark;
      }
      /* conteúdo gerado no build para buscadores; o React o substitui ao carregar */
      .estatico {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px;
        font: 16px/1.6 system-ui, sans-serif;
      }
      .estatico a {
        color: inherit;
      }
      .estatico img {
        max-width: 100%;
        height: auto;
      }
      .estatico pre {
        overflow-x: auto;
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- meta:inicio (trocado em cada página gerada no build) -->
    <title>Rodrigo Bossini — Professor e Desenvolvedor</title>
    <meta name="description" content="Professor universitário de Inteligência Artificial, Algoritmos, Computação em Nuvem e DevOps no Instituto Mauá, na São Judas e na Fatec. Material didático, codelabs e trajetória." />
    <link rel="canonical" href="https://professorbossini.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rodrigo Bossini" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://professorbossini.dev/" />
    <meta property="og:title" content="Rodrigo Bossini — Professor e Desenvolvedor" />
    <meta property="og:description" content="Professor universitário de Inteligência Artificial, Algoritmos, Computação em Nuvem e DevOps no Instituto Mauá, na São Judas e na Fatec. Material didático, codelabs e trajetória." />
    <meta property="og:image" content="https://professorbossini.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- meta:fim -->

    <script>
      // Aplica o tema salvo antes do React carregar, para evitar o flash de tema errado.
      try {
        var modo = localStorage.getItem('mui-mode') || 'dark'
        if (modo === 'system') modo = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-' + modo, '')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
