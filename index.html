<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rodrigo Bossini — Professor e Desenvolvedor</title>
    <meta name="description" content="Rodrigo Bossini — professor universitário de Algoritmos, Computação em Nuvem (AWS) e DevOps. Material didático, redes e contato." />
    <meta name="theme-color" content="#5B2DB0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#140E26" media="(prefers-color-scheme: dark)" />
    <style>
      /* cor de fundo antes do React carregar (tema Faísca) */
      html[data-light] {
        background: #fbfafe;
        color-scheme: light;
      }
      html[data-dark] {
        background: #140e26;
        color-scheme: dark;
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://professorbossini.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://professorbossini.dev/" />
    <meta property="og:title" content="Rodrigo Bossini" />
    <meta property="og:description" content="Professor universitário e desenvolvedor de software. Algoritmos, Cloud, DevOps e IA." />
    <meta property="og:image" content="https://professorbossini.dev/images/perfil.jpg" />
    <meta name="twitter:card" content="summary" />

    <script>
      // Aplica o tema salvo antes do React carregar, para evitar o flash de tema errado.
      try {
        var modo = localStorage.getItem('mui-mode') || 'dark'
        if (modo === 'system') modo = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-' + modo, '')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
